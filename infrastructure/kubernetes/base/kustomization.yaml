apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: careerpilot
resources:
  - namespace.yaml
  - service-accounts.yaml
  - configmap.yaml
  - services.yaml
  - deployments.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policies.yaml
  - migration-job.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: careerpilot
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
