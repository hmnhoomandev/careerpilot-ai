[project]
name = "careerpilot-temporal-worker"
version = "0.1.0"
description = "CareerPilot durable application workflow worker."
requires-python = ">=3.13,<3.14"
dependencies = [
  "temporalio>=1.30,<1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpilot_temporal"]
