name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  build-scan-attest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build API without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/python-service.Dockerfile
          push: false
          tags: careerpilot-api:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Build web without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: careerpilot-web:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Generate reviewable dependency SBOM
        run: python scripts/generate_sbom.py --output .artifacts/careerpilot.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: careerpilot-sbom
          path: .artifacts/careerpilot.cdx.json

# Publishing, signing, and deployment are intentionally absent until Workload
# Identity Federation, protected environments, cost approval, and registries exist.
