name: careerpilot

services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    environment:
      POSTGRES_DB: ${CAREERPILOT_POSTGRES_DB:-careerpilot}
      POSTGRES_PASSWORD: ${CAREERPILOT_POSTGRES_PASSWORD:?Set in an ignored .env file}
      POSTGRES_USER: ${CAREERPILOT_POSTGRES_USER:-careerpilot_local}
    ports:
      - "127.0.0.1:${CAREERPILOT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - careerpilot-postgres:/var/lib/postgresql/data

volumes:
  careerpilot-postgres:
