[project]
name = "careerpilot-api"
version = "0.1.0"
description = "CareerPilot AI HTTP API package shell."
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.18,<1.19",
  "careerpilot-core",
  "fastapi>=0.135,<0.136",
  "opentelemetry-api>=1.37,<1.38",
  "pgvector>=0.4,<0.5",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.14,<7",
  "python-multipart>=0.0.22,<0.1",
  "sqlalchemy>=2.0.46,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
careerpilot-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
